[package]
name = "audio"
module_roots = ["src"]
entry = "src/audio.zi"
links = ["ziran_mp3", "vorbisfile", "vorbis", "ogg", "opus", "samplerate", "m"]

[toolchain]
git = "https://github.com/ziranlang/ziran.git"
ref = "2313b49cb005610853faeec46447fc38578a2a15"

[exports]
types = "src/types.zi"
ogg_opus = "src/ogg_opus.zi"
decode_opus = "src/decode_opus.zi"
opus = "src/opus.zi"
pipeline = "src/pipeline.zi"
resample = "src/resample.zi"
mp3_resample = "src/mp3_resample.zi"
vorbis_resample = "src/vorbis_resample.zi"

# Optional native sources; core decoders and their recipes belong to Ziran.
[dependencies.libopus]
git = "https://github.com/xiph/opus.git"
ref = "ddbe48383984d56acd9e1ab6a090c54ca6b735a6"
source = true

[dependencies.libsamplerate]
git = "https://github.com/libsndfile/libsamplerate.git"
ref = "c96f5e3de9c4488f4e6c97f59f5245f22fda22f7"
source = true
